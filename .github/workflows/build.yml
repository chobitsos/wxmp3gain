name: Windows x64 build

on:
  # Run on every branch push and every tag push, so the resulting .exe is
  # produced and uploaded as a workflow artifact for any branch (including
  # `copilot/*` working branches), not just `main`.
  push:
    branches:
      - "**"
    tags:
      - "**"
  pull_request:
  workflow_dispatch:

jobs:
  build-windows-x64:
    name: Build Windows x64 executable (MinGW)
    runs-on: windows-latest

    # Run every step inside the MSYS2 MINGW64 shell so we have a single
    # consistent gcc / cmake / make / wxWidgets toolchain.
    defaults:
      run:
        shell: msys2 {0}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up MSYS2 (MINGW64)
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            base-devel
            git
            zip
            mingw-w64-x86_64-toolchain
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-make
            mingw-w64-x86_64-pkgconf
            mingw-w64-x86_64-gettext
            mingw-w64-x86_64-wxwidgets3.2-msw

      - name: Show toolchain versions
        run: |
          gcc --version
          g++ --version
          cmake --version
          mingw32-make --version
          wx-config --version --selected-config
          msgfmt --version | head -n 1

      - name: Configure (CMake / MinGW Makefiles, x64 Release)
        run: |
          cmake -S . -B build \
            -G "MinGW Makefiles" \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="$(pwd)/build/dist" \
            -DwxWidgets_CONFIG_EXECUTABLE=/mingw64/bin/wx-config

      - name: Build
        run: cmake --build build --config Release -j

      - name: Install (stage into build/dist)
        run: cmake --install build --config Release

      - name: Bundle MinGW/wxWidgets runtime DLLs next to the .exe
        # NOTE: intentionally NOT using `set -e` here. The bundling logic uses
        # `ldd | awk | grep` pipelines, and it is perfectly normal for some
        # transitively-loaded DLL (e.g. libdeflate.dll) to have *zero* deps
        # under /mingw64/bin — in that case `grep` legitimately exits 1, and
        # under `set -e` that would abort the whole step.
        run: |
          EXE="build/dist/wxmp3gain.exe"
          if [ ! -f "$EXE" ]; then
            echo "Built executable not found at $EXE"
            ls -la build/dist || true
            exit 1
          fi

          # Iterative worklist: discover every transitive DLL that lives under
          # /mingw64/bin and copy it next to the .exe. We use a plain queue
          # instead of recursion-inside-a-pipeline so subshell scoping does
          # not lose state, and we tolerate non-zero exits from ldd/grep.
          mkdir -p build/dist
          queue=("$EXE")
          while [ "${#queue[@]}" -gt 0 ]; do
            target="${queue[0]}"
            queue=("${queue[@]:1}")

            # `|| true` so an ldd hiccup or a DLL with no /mingw64/bin deps
            # never aborts the loop.
            deps="$(ldd "$target" 2>/dev/null \
                      | awk '/=>/ {print $3}' \
                      | grep -i '^/mingw64/bin/' \
                      | sort -u || true)"

            [ -z "$deps" ] && continue

            while IFS= read -r dep; do
              [ -z "$dep" ] && continue
              name="$(basename "$dep")"
              if [ ! -f "build/dist/$name" ]; then
                cp -v "$dep" "build/dist/"
                queue+=("build/dist/$name")
              fi
            done <<< "$deps"
          done

          echo "Bundled DLLs:"
          ls build/dist/*.dll 2>/dev/null || echo "(none)"

      - name: Verify x64 architecture of the executable
        run: |
          file build/dist/wxmp3gain.exe
          file build/dist/wxmp3gain.exe | grep -q "x86-64"

      - name: List final dist contents
        run: ls -la build/dist

      - name: Create distributable zip
        run: |
          cd build
          zip -r "wxmp3gain-windows-x64.zip" dist
          ls -la wxmp3gain-windows-x64.zip

      - name: Upload build artifact (folder)
        uses: actions/upload-artifact@v4
        with:
          name: wxmp3gain-windows-x64
          path: build/dist/
          if-no-files-found: error

      - name: Upload build artifact (zip)
        uses: actions/upload-artifact@v4
        with:
          name: wxmp3gain-windows-x64-zip
          path: build/wxmp3gain-windows-x64.zip
          if-no-files-found: error

      - name: Attach binary to GitHub Release (tag pushes only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build/wxmp3gain-windows-x64.zip
